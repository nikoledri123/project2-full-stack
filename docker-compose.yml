services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://appuser:apppassword@db:3306/appdb
    ports:
      - "8081:8000"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appuser", "-papppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "8082:80"
    volumes:
      - ./ngnix/ngnix.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ngnix/static:/usr/share/nginx/html/static:ro
      - ./ngnix/static/index.html:/usr/share/nginx/html/index.html:ro

volumes:
  db_data: